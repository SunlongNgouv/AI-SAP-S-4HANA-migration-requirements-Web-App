<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="Instrument Sans, Arial, Helvetica, sans-serif">
<title id="t">Life of a requirement</title><desc id="d">A requirement is logged, reviewed, clarified, proposed and baselined. It can be marked Duplicated or Obsoleted instead.</desc>
<rect width="1200" height="520" fill="#FFF5E3"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2D2A27"/></marker></defs>
<text x="40" y="48" font-size="26" font-weight="700" fill="#2D2A27" text-anchor="start">The life of a requirement</text>
<text x="40" y="76" font-size="15" font-weight="400" fill="#6F675E" text-anchor="start">Five stages from first idea to an agreed design. Status values in the sheet follow along.</text>
<rect x="40" y="120" width="196" height="220" rx="16" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<rect x="58" y="134" width="160" height="6" rx="3" fill="#C5E4CC"/>
<circle cx="70" cy="176" r="17" fill="#C5E4CC"/>
<text x="70" y="182" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="middle">1</text>
<text x="98" y="182" font-size="18" font-weight="700" fill="#2D2A27" text-anchor="start">Logged</text>
<text x="58" y="220.0" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">The stakeholder answers</text>
<text x="58" y="240.3" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">the questions in</text>
<text x="58" y="260.6" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">Capture.</text>
<rect x="58" y="290" width="160" height="32" rx="8" fill="#EFEDE8"/>
<text x="68" y="311" font-size="12" font-weight="600" fill="#2D2A27" text-anchor="start">Status: Pending</text>
<line x1="240" y1="230" x2="264" y2="230" stroke="#2D2A27" stroke-width="2" marker-end="url(#ah)"/>
<rect x="266" y="120" width="196" height="220" rx="16" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<rect x="284" y="134" width="160" height="6" rx="3" fill="#F2CDC4"/>
<circle cx="296" cy="176" r="17" fill="#F2CDC4"/>
<text x="296" y="182" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="middle">2</text>
<text x="324" y="182" font-size="18" font-weight="700" fill="#2D2A27" text-anchor="start">Reviewed</text>
<text x="284" y="220.0" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">The analyst checks it,</text>
<text x="284" y="240.3" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">sets priority and</text>
<text x="284" y="260.6" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">dependencies.</text>
<rect x="284" y="290" width="160" height="32" rx="8" fill="#EFEDE8"/>
<text x="294" y="311" font-size="12" font-weight="600" fill="#2D2A27" text-anchor="start">Status: Reviewed</text>
<line x1="466" y1="230" x2="490" y2="230" stroke="#2D2A27" stroke-width="2" marker-end="url(#ah)"/>
<rect x="492" y="120" width="196" height="220" rx="16" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<rect x="510" y="134" width="160" height="6" rx="3" fill="#DEA193"/>
<circle cx="522" cy="176" r="17" fill="#DEA193"/>
<text x="522" y="182" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="middle">3</text>
<text x="550" y="182" font-size="18" font-weight="700" fill="#2D2A27" text-anchor="start">Clarified</text>
<text x="510" y="220.0" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">Follow-up questions are</text>
<text x="510" y="240.3" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">asked and answered.</text>
<rect x="510" y="290" width="160" height="32" rx="8" fill="#EFEDE8"/>
<text x="520" y="311" font-size="12" font-weight="600" fill="#2D2A27" text-anchor="start">Follow-up and answers</text>
<line x1="692" y1="230" x2="716" y2="230" stroke="#2D2A27" stroke-width="2" marker-end="url(#ah)"/>
<rect x="718" y="120" width="196" height="220" rx="16" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<rect x="736" y="134" width="160" height="6" rx="3" fill="#D0C8BA"/>
<circle cx="748" cy="176" r="17" fill="#D0C8BA"/>
<text x="748" y="182" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="middle">4</text>
<text x="776" y="182" font-size="18" font-weight="700" fill="#2D2A27" text-anchor="start">Proposed</text>
<text x="736" y="220.0" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">The implementation team</text>
<text x="736" y="240.3" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">proposes the SAP</text>
<text x="736" y="260.6" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">set-up.</text>
<rect x="736" y="290" width="160" height="32" rx="8" fill="#EFEDE8"/>
<text x="746" y="311" font-size="12" font-weight="600" fill="#2D2A27" text-anchor="start">Change request column</text>
<line x1="918" y1="230" x2="942" y2="230" stroke="#2D2A27" stroke-width="2" marker-end="url(#ah)"/>
<rect x="944" y="120" width="196" height="220" rx="16" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<rect x="962" y="134" width="160" height="6" rx="3" fill="#FF7023"/>
<circle cx="974" cy="176" r="17" fill="#FF7023"/>
<text x="974" y="182" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="middle">5</text>
<text x="1002" y="182" font-size="18" font-weight="700" fill="#2D2A27" text-anchor="start">Baselined</text>
<text x="962" y="220.0" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">The design is agreed</text>
<text x="962" y="240.3" font-size="14" font-weight="400" fill="#2D2A27" text-anchor="start">and tracked.</text>
<rect x="962" y="290" width="160" height="32" rx="8" fill="#EFEDE8"/>
<text x="972" y="311" font-size="12" font-weight="600" fill="#2D2A27" text-anchor="start">Traceability matrix</text>
<text x="40" y="392" font-size="17" font-weight="700" fill="#2D2A27" text-anchor="start">Instead of moving forward, a requirement can be set aside</text>
<rect x="40" y="410" width="540" height="80" rx="14" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<rect x="40" y="410" width="8" height="80" rx="0" fill="#DEA193"/>
<text x="66" y="438" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="start">Duplicated</text>
<text x="66" y="462" font-size="13.5" font-weight="400" fill="#2D2A27" text-anchor="start">Same need as another requirement. Keep the fuller one, point to it in Notes.</text>
<rect x="620" y="410" width="540" height="80" rx="14" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<rect x="620" y="410" width="8" height="80" rx="0" fill="#D0C8BA"/>
<text x="646" y="438" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="start">Obsoleted</text>
<text x="646" y="462" font-size="13.5" font-weight="400" fill="#2D2A27" text-anchor="start">No longer needed. Keep the row so the history stays visible.</text>
</svg>