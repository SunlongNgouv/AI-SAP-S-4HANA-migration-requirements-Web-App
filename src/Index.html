<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Requirement Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cloud:#FFF5E3;--stone:#D0C8BA;--ash:#2D2A27;--orange:#FF7023;--orange-d:#D55D1D;--mint:#C5E4CC;--moss:#8FA596;--rose:#F2CDC4;--quartz:#DEA193;--cinn:#BD673D;--walnut:#71584C;--card:#FFFDF8;--line:#E3D9C6;--muted:#6F675E;--ink-on-tint:#2D2A27;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cloud:#2D2A27;--card:#37332F;--line:#4B4540;--ash:#FFF5E3;--muted:#BDB3A4;--stone:#5a534c}}
:root[data-theme="dark"]{--cloud:#2D2A27;--card:#37332F;--line:#4B4540;--ash:#FFF5E3;--muted:#BDB3A4;--stone:#5a534c}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cloud);color:var(--ash);font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:1280px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:4px 4px 14px}
.brand{display:flex;align-items:center;gap:10px}.logo{height:34px;width:auto;display:block}
.brand b{font-size:18px;display:block;line-height:1.1}.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;white-space:nowrap;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ash);color:var(--cloud)}
.tright{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--orange);color:var(--orange-d);border-radius:999px;padding:8px 16px;font-weight:600;text-decoration:none;background:transparent}
.src:hover{background:var(--orange);color:#fff}
@media (prefers-color-scheme:dark){.src{color:var(--orange)}}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}.who b{display:block;color:var(--ash);font-size:13px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:#4aa564;box-shadow:0 0 0 4px rgba(74,165,100,.2)}
.sync.stale::before{background:var(--quartz);box-shadow:0 0 0 4px rgba(222,161,147,.3)}
.panel{display:none}.panel.on{display:block}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;overflow:hidden}
.card{border-radius:26px 26px 26px 6px;padding:28px}
.box h3{font-size:15px;margin-bottom:12px}
.gate{max-width:560px;margin:48px auto}
.gate h2{font-size:30px;line-height:1.15;margin-bottom:8px}.gate p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--stone);background:transparent;border-radius:14px 14px 14px 4px;padding:10px 15px;font-weight:500;transition:.15s;text-align:left}
.chip:hover{border-color:var(--orange)}.chip.sel{background:var(--orange);border-color:var(--orange);color:#fff}.chip.sel::before{content:"✓ "}
.chip.big{padding:16px 18px;min-width:220px}.chip.big small{display:block;font-weight:400;opacity:.8;font-size:12px}.chip.big.sel::before{content:""}
.t{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--stone);background:var(--card);color:var(--ash)}
textarea.t{min-height:110px;resize:vertical}select.t{width:auto}
label.l{display:block;font-weight:600;margin:14px 0 6px}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:600;background:var(--ash);color:var(--cloud)}
.btn.p{background:var(--orange);color:#fff}.btn.p:hover{background:var(--orange-d)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.g{background:transparent;color:var(--ash);border:1.5px solid var(--stone)}.btn.sm{padding:6px 12px;font-size:13px}.btn.danger{background:var(--clay,#95685D);color:#fff}
.hint{font-size:13px;color:var(--muted)}
.help{background:var(--cloud);border-radius:14px;padding:12px 14px;font-size:13px;border-left:4px solid var(--moss);margin-top:12px}
/* chat */
.chat{max-width:780px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:30px 30px 30px 8px;display:flex;flex-direction:column;height:min(720px,calc(100vh - 200px));min-height:520px;overflow:hidden}
.chead{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chead .logo{height:26px}.chead .bar{margin-left:auto;width:140px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}.chead .bar i{display:block;height:100%;background:var(--orange);transition:width .3s}
.msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.m{max-width:84%;padding:12px 16px;border-radius:20px 20px 20px 5px;background:var(--cloud)}
.m small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.me{align-self:flex-end;background:var(--orange);color:#fff;border:0;border-radius:20px 20px 5px 20px;text-align:left}.me:hover{background:var(--orange-d)}
.me em{display:block;font-style:normal;font-size:11px;opacity:.85}
.ctl{border-top:1px solid var(--line);padding:14px 16px}.ctl .chips{margin:0 0 10px;max-height:160px;overflow:auto}
.row{display:flex;gap:8px;align-items:flex-end}.row .t{flex:1}
.msg-in{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.msg-in{animation:none}}
.sumrow{display:grid;grid-template-columns:130px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.sumrow span:first-child{color:var(--muted)}.sumrow button{border:0;background:none;text-decoration:underline;color:var(--cinn)}
.done{text-align:center;padding:40px 16px}.done h2{font-size:32px;margin:10px 0}
/* register */
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:16px}
.bar2 .t{padding:8px 12px;border-radius:12px}.bar2 .grow{flex:1;min-width:190px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border-radius:20px 20px 20px 5px;padding:16px;color:#2D2A27}.kpi b{font-size:34px;line-height:1;display:block}.kpi span{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-bottom:16px}.g4{grid-column:span 4}.g12{grid-column:span 12}.g5{grid-column:span 5}.g7{grid-column:span 7}
@media(max-width:900px){.g4,.g5,.g7{grid-column:span 12}}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-top:8px;color:var(--muted)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hb{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;font-size:13px}.hb .b{height:12px;border-radius:6px;background:var(--cloud);overflow:hidden}.hb .b i{display:block;height:100%;border-radius:6px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:rgba(255,112,35,.06)}tr.del td{opacity:.5;text-decoration:line-through}
.pill{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-block;color:#2D2A27}
.ra{display:flex;gap:6px}.ra button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 8px;font-size:12px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* access */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}@media(max-width:800px){.three{grid-template-columns:1fr}}
.role{border-radius:22px 22px 22px 5px;padding:18px;color:#2D2A27}.role h3{margin-bottom:6px}.role ul{margin:8px 0 0;padding-left:18px;font-size:13px}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:170px 28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#2D2A27}
@media(max-width:700px){.tl li{grid-template-columns:1fr}}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--cloud);border-radius:8px;padding:6px 8px;margin-top:6px;word-break:break-word}.diff s{color:#95685D}.diff u{text-decoration:none;color:#2f7a4a;font-weight:600}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(45,42,39,.55);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--card);border-radius:26px 26px 26px 6px;max-width:760px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.sheet header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .body{padding:6px 22px 14px;overflow:auto}.sheet footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px}.checks label{display:flex;gap:8px;align-items:center;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ash);color:var(--cloud);padding:11px 20px;border-radius:999px;font-weight:500;z-index:30;max-width:90vw}
#toast.bad{background:#95685D;color:#fff}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--stone);border-top-color:var(--orange);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

.capsw{display:flex;gap:4px;width:max-content;max-width:100%;margin:0 auto 14px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.capsw button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:500;color:var(--muted);white-space:nowrap}
.capsw button[aria-pressed="true"]{background:var(--ash);color:var(--cloud)}
.split{display:grid;grid-template-columns:minmax(260px,38%) 1fr;min-height:600px;border-radius:30px 30px 30px 8px;overflow:hidden;border:1px solid var(--line);background:var(--card);max-width:1100px;margin:0 auto}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.sl{padding:30px 40px 30px 30px;color:#2D2A27;display:flex;flex-direction:column;transition:background .35s;clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
@media(max-width:820px){.sl{clip-path:none;padding:22px}}
.sl .cnt{font-weight:600;font-size:14px}.sl h3{font-size:30px;line-height:1.1;margin:22px 0 10px;letter-spacing:-.02em}.sl p{margin:0 0 12px;max-width:34ch}
.sl .ex{background:rgba(255,255,255,.55);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:auto}
.dots{display:flex;gap:5px;margin-top:18px}.dots i{height:6px;flex:1;border-radius:6px;background:rgba(45,42,39,.2)}.dots i.f{background:#2D2A27}
.sr{padding:44px 44px 28px;display:flex;flex-direction:column;min-width:0}
.sr h2{font-size:32px;line-height:1.12;font-weight:500;letter-spacing:-.02em;max-width:22ch}
.sr .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:24px}
@media(max-width:820px){.sr{padding:24px 20px}.sr h2{font-size:26px}}
@media(prefers-reduced-motion:reduce){.sl{transition:none}}

.chips2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 14px;min-height:32px}
.fchip{border:0;background:var(--rose);color:#2D2A27;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}.fchip:hover{background:var(--quartz)}
.seg{stroke-width:30;cursor:pointer;transition:opacity .15s,stroke-width .15s}.seg:hover{stroke-width:35}.seg.on{stroke-width:38}.seg.dim{opacity:.3}
.pt{cursor:pointer}.pt:hover .dot{r:6}.pt:focus-visible{outline:none}.pt:focus-visible .dot{stroke:#2D2A27}
.lgl{max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:10px}
.lg{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:8px;padding:3px 6px;font-size:12px;text-align:left;width:100%}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lg b{margin-left:auto}
.lg:hover{background:var(--cloud)}.lg.on{background:var(--rose);color:#2D2A27}.lg.dim{opacity:.45}
.bt{margin:8px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.hb{width:100%;background:none;border:0;padding:3px 6px;border-radius:8px;text-align:left;margin:2px 0}.hb:hover{background:var(--cloud)}.hb.on{background:var(--rose);color:#2D2A27}.hb.dim{opacity:.45}
.hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .b{display:block}
tr.click{cursor:pointer}tr.click:focus-visible{outline-offset:-3px}
.ra .det{border-color:var(--orange);color:var(--orange-d);font-weight:600}
@media (prefers-color-scheme:dark){.ra .det{color:var(--orange)}}
.tag{display:inline-block;background:var(--cloud);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;margin:0 6px 6px 0}
.sheet.wide{max-width:900px}
.dname{font-size:26px;line-height:1.2;margin:10px 0 14px}
.dmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
.dmeta h4,.dsec h4,.dgrid h4{margin:0 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dsec{background:var(--cloud);border-radius:16px;padding:12px 16px;margin:10px 0}
.ptxt a{color:var(--cinn);overflow-wrap:anywhere}
.ptxt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px;margin:14px 0}
.dfoot{margin-top:14px}
@media(max-width:700px){.dmeta,.dgrid{grid-template-columns:1fr}.dname{font-size:22px}}
@media(max-width:1100px){.g4{grid-column:span 6}.grid>.g4:nth-of-type(3){grid-column:span 12}}
@media(max-width:900px){.g4,.g5,.g7,.grid>.g4:nth-of-type(3){grid-column:span 12}}
.addgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;align-items:start}
@media(max-width:800px){.addgrid{grid-template-columns:1fr}}

.gsearch{margin:14px 0 4px}
.gh{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 0;font-weight:600}
.chipw{display:inline-flex}
.chipw .chip{border-radius:14px 0 0 4px}
.chipw .info{border:1.5px solid var(--stone);border-left:0;background:transparent;border-radius:0 14px 4px 0;width:32px;font-weight:700;font-style:italic;font-family:Georgia,serif;color:var(--muted)}
.chipw .info:hover{background:var(--cloud);color:var(--ash)}
.chipw .chip.sel + .info{background:var(--orange);border-color:var(--orange);color:#fff}
.chipw.hit .chip,.chipw.hit .info{border-color:var(--orange)}
.chipw.dim{opacity:.35}
.ctl .gwrap{max-height:230px;overflow:auto}
.ctl .gwrap .chips{max-height:none;overflow:visible}
.gcard{margin-top:16px;background:rgba(255,255,255,.6);border-radius:16px;padding:12px 14px;max-height:380px;overflow:auto;font-size:13px;color:#2D2A27}
.m.ginfo{max-width:92%;max-height:230px;overflow:auto;font-size:13px}
.gc .gt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.gc .gt b{font-size:15px;margin-right:4px}
.gc .gs{margin:6px 0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.gc ul{list-style:none;margin:0 0 10px;padding:0}
.gc li{margin:0 0 8px}
.gc li b{display:block;font-size:13px}
.gc li span{display:block;font-size:12px;opacity:.85}
mark{background:#FFD2B8;color:inherit;border-radius:3px;padding:0 2px}

.msgs>*{flex:none}
.ctl .gwrap{max-height:clamp(120px,24vh,200px)}
@media(max-width:600px){.chat{height:calc(100vh - 140px);min-height:480px}}

.g3{grid-column:span 6}
@media(min-width:1500px){.g3{grid-column:span 3}}
@media(max-width:700px){.g3{grid-column:span 12}}
.pw{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:18;width:min(340px,86vw);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 12px 30px rgba(45,42,39,.22)}
.plist{max-height:260px;overflow:auto;margin:8px 0}
.pi{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.pi:hover{background:var(--cloud)}.pi .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pi .pc{color:var(--muted);font-size:12px}
.pfoot{display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap}
.pb{cursor:pointer;transition:opacity .15s}.pb:hover rect{opacity:.85}.pb.dim{opacity:.35}.pb.on rect{stroke:#2D2A27;stroke-width:2.5}.pb:focus-visible{outline:none}.pb:focus-visible rect{stroke:#2D2A27;stroke-width:2.5}

.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack>.box{flex:1;min-width:0}
@media(max-width:1100px){.stack{flex-direction:row}}
@media(max-width:700px){.stack{flex-direction:column}}
#f-who{padding:8px 12px;border-radius:12px;font-weight:400;background:var(--card);border:1.5px solid var(--stone);color:var(--ash);line-height:1.5;white-space:nowrap}
#f-who:hover{border-color:var(--orange)}

.bar2 .t,.bar2 #f-who{height:40px}
#f-who{padding:0 12px;display:inline-flex;align-items:center}

.stack>.box{flex:none}
@media(max-width:1100px){.stack>.box{flex:1 1 0}}
@media(max-width:700px){.stack>.box{flex:none}}

.bar2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;align-items:center}
.bar2 .t,.bar2 #f-who{width:100%;min-width:0;height:40px}
.bar2 .grow{min-width:0}
@media(min-width:700px){.bar2 #f-q{grid-column:span 2}}
.bar2 .dl{display:flex;align-items:center;gap:8px;min-width:0}
.bar2 .dl .t{flex:1}
.bar2 .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pw{min-width:0}
#f-who{display:block;text-align:left;line-height:37px;padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bar2 .dl>span{width:36px;flex:none}

.bar2 .msb{display:block;width:100%;min-width:0;height:40px;padding:0 12px;border-radius:12px;font-weight:400;background:var(--card);border:1.5px solid var(--stone);color:var(--ash);text-align:left;line-height:37px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar2 .msb:hover{border-color:var(--orange)}
</style></head>
<body>
<div class="app">
 <header class="top">

    <div class="pw" id="proc-wrap"><button class="msb" id="f-proc" aria-haspopup="true" aria-expanded="false" aria-label="Filter by process">All processes ▾</button><div class="pop" id="proc-pop" hidden role="dialog" aria-label="Filter by process"><input class="t" id="proc-q" type="search" placeholder="Search processes" aria-label="Search processes" autocomplete="off"><div class="plist" id="proc-list"></div><div class="pfoot"><button class="btn g sm" id="proc-all">Select shown</button><button class="btn g sm" id="proc-none">Clear</button><button class="btn sm" id="proc-done">Done</button></div></div></div>

<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h3 id="mt"></h3><button class="btn g sm" id="mx">Close</button></header><div class="body" id="mb"></div><footer id="mf"></footer></div></div>
<div class="modal" id="dlg" hidden style="z-index:40"><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-m" style="max-width:460px"><div class="body" style="padding:24px 24px 8px"><h3 id="dlg-t" style="font-size:20px;margin:0 0 8px"></h3><p id="dlg-m" style="margin:0;color:var(--muted)"></p></div><footer><button class="btn g" id="dlg-no">Cancel</button><button class="btn p" id="dlg-ok">OK</button></footer></div></div>
<div id="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RANK={viewer:1,editor:2,owner:3};
let MISSING=[],ME,CFG,SHEET,ROWS=[],VER=0,lastSync=0,pollT,clockT,tabNow='',page=0,PAGE=15,started=false;
const can=r=>ME&&ME.role&&RANK[ME.role]>=RANK[r];
function api(fn,...a){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(nice((e&&e.message)||String(e))))) [fn](...a))}
function nice(m){m=String(m||'').replace(/^(Uncaught )?(Error|Exception|TypeError|ScriptError):\s?/i,'').trim();
 if(/obtain lock|another process/i.test(m))return 'Someone else is saving at the same moment. Please try again in a few seconds.';
 if(/not authorized|authorization is required|authorisation/i.test(m))return 'Google needs you to sign in again. Please reload the page.';
 if(/server error|invoked too many times|quota|try again in a few/i.test(m))return 'Google is busy right now. Please wait a moment and try again.';
 if(/failed to fetch|network|timed out|timeout/i.test(m))return 'The connection dropped. Please check your internet and try again.';
 return m||'Something went wrong. Please try again.'}
function askConfirm(o){return new Promise(res=>{const d=$('#dlg'),ok=$('#dlg-ok'),no=$('#dlg-no');
 $('#dlg-t').textContent=o.title;$('#dlg-m').textContent=o.message;ok.textContent=o.ok||'OK';no.textContent=o.cancel||'Cancel';ok.className='btn '+(o.danger?'danger':'p');
 d.hidden=false;(o.danger?no:ok).focus();
 const done=v=>{d.hidden=true;ok.onclick=null;no.onclick=null;d.onclick=null;document.removeEventListener('keydown',key,true);res(v)};
 const key=e=>{if(e.key==='Escape'){e.stopPropagation();done(false)}if(e.key==='Tab'){e.preventDefault();const f=[no,ok],i=f.indexOf(document.activeElement);f[(i+(e.shiftKey?-1:1)+2)%2].focus()}};
 document.addEventListener('keydown',key,true);ok.onclick=()=>done(true);no.onclick=()=>done(false);d.onclick=e=>{if(e.target===d)done(false)}})}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,bad?6000:3200)}
const fmt=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?'':d.toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})};
const day=iso=>{if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const split=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean);

function gate(kind,msg){
 $('#main').hidden=true;$('#tabs').hidden=true;$('#who').hidden=true;$('#sync').hidden=true;$('#gate').hidden=false;stopTimers();
 const g=$('#gate');
 if(kind==='loading'){g.innerHTML='<p><span class="spin"></span>Loading…</p>';return}
 if(kind==='error'){g.innerHTML=`<h2>Something went wrong</h2><p>${esc(msg)}</p><button class="btn p" id="retry">Try again</button>`;$('#retry').onclick=init;return}
 if(kind==='noid'){g.innerHTML='<h2>We could not identify you</h2><p>Open this page while signed in to your company Google account. If the problem continues, ask the app owner to check the deployment access setting.</p>';return}
 if(kind==='pending'){g.innerHTML=`<h2>Your request is waiting for approval</h2><p>An Owner has been emailed. You will get an email when it is decided. Signed in as ${esc(ME.email)}.</p>`;return}
 const declined=ME.status==='Declined'||ME.status==='Revoked';
 g.innerHTML=`<h2>${declined?'Your access was removed or declined':'Request access'}</h2><p>You are signed in as <b>${esc(ME.email)}</b>. Tell the Owner who you are and what you need. ${declined?'You can send a new request.':''}</p>
 <label class="l" for="r-name">Your name</label><input class="t" id="r-name" autocomplete="name">
 <label class="l">Role you need</label><div class="chips" id="r-roles">${['Viewer','Editor','Owner'].map((r,i)=>`<button class="chip ${i==1?'sel':''}" data-r="${r}">${r}</button>`).join('')}</div>
 <label class="l" for="r-why">Why do you need it?</label><textarea class="t" id="r-why" placeholder="For example: I own the planning requirements"></textarea>
 <div class="help">Viewer: see the register and charts. Editor: also add, edit and delete requirements. Owner: also manage access and see the audit log.</div>
 <p><button class="btn p" id="r-send">Send to Owners</button></p>`;
 let role='Editor';$$('#r-roles .chip').forEach(c=>c.onclick=()=>{role=c.dataset.r;$$('#r-roles .chip').forEach(x=>x.classList.toggle('sel',x===c))});
 $('#r-send').onclick=async()=>{const b=$('#r-send');b.disabled=true;try{await api('requestAccess',$('#r-name').value,role,$('#r-why').value);ME.status='Pending';gate('pending')}catch(e){toast(e.message,true);b.disabled=false}};
}
async function init(){
 gate('loading');
 try{const b=await api('bootstrap');ME=b.me;CFG=b.cfg;SHEET=b.sheetUrl;VER=b.ver;MISSING=b.missing||[];setGuide(b.guide);$('#srcbtn').href=SHEET;
  if(!ME.email)return gate('noid');
  if(!ME.role)return gate(ME.status==='Pending'?'pending':'request');
  await enter();
 }catch(e){gate('error',e.message)}
}
async function enter(){
 $('#gate').hidden=true;$('#main').hidden=false;$('#tabs').hidden=false;
 $('#who').hidden=false;$('#who').innerHTML=`<b>${esc(ME.name||ME.email)}</b>${esc(ME.email)} · ${ME.role[0].toUpperCase()+ME.role.slice(1)}`;
 $('#sync').hidden=false;
 const w=$('#warn');if(MISSING.length&&can('owner')){w.hidden=false;w.innerHTML='<b>Some sheet columns were not found:</b> '+esc(MISSING.join(', '))+'. The app cannot read or save those fields until the header names are restored.'}else w.hidden=true;
 $$('.tab').forEach(t=>t.hidden=!can(t.dataset.min));
 buildFilters();resetChat();
 await loadData();
 goTab(can('editor')?'cap':'reg');
 startTimers();
}
function goTab(p){tabNow=p;$$('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.p===p));$$('.panel').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));
 if(p==='acc')renderAccess();if(p==='log')renderLog();if(p==='reg')renderReg();if(p==='cap')drawChat()}
$$('.tab').forEach(t=>t.onclick=()=>goTab(t.dataset.p));

async function loadData(){const d=await api('getData');ROWS=d.rows;VER=d.ver;lastSync=Date.now();if(tabNow==='reg')renderReg();tickSync()}
function tickSync(){const s=Math.round((Date.now()-lastSync)/1000),el=$('#sync');el.textContent=`Live · synced ${s<5?'just now':s+'s ago'}`;el.classList.toggle('stale',s>30)}
function startTimers(){stopTimers();clockT=setInterval(tickSync,1000);pollT=setInterval(async()=>{
  if(document.hidden||$('#modal').hidden===false)return;
  try{const v=await api('poll');lastSync=Date.now();if(v!==VER){await loadData();if(tabNow==='acc'&&!typingInAccess())renderAccess();if(tabNow==='log')renderLog()}}catch(e){}},CFG.pollMs||7000)}
function stopTimers(){clearInterval(pollT);clearInterval(clockT)}

const L=()=>CFG.lists;
const STEPS=()=>[
 {k:'who',label:'Your name',t:'text',q:'First, what is your name?',why:`We record who logged each requirement, along with your Google email (${ME.email}).`,ph:'Your full name',ex:'Jordan Lee'},
 {k:'name',label:'Name',t:'text',q:'What would you call this requirement?',why:'A short title that sums up the problem or need, so others recognize it in a list.',ph:'e.g., Expedite request approvals',ex:'Manual expedite request approvals'},
 {k:'area',label:'Process area',t:'multi',q:'Which parts of the business does this touch?',why:'This tells the project team which workstreams need to hear about it.',opts:L().areas},
 {k:'proc',label:'Process',t:'single',q:'Which process step is it part of?',why:'Pick the step where the problem shows up, not where it starts.',opts:L().procs},
 {k:'brd',label:'Type',t:'big',q:'What best describes it?',why:'We use this to sort what gets looked at first.',opts:[['Pain Point','Something hurts or breaks today'],['System Efficiency','The system should do this for us'],['Operations Enhancement','A better way to run the process']]},
 {k:'order',label:'Order type',t:'multi',q:'Which kinds of orders are affected?',why:'Different order types often follow different rules.',opts:L().orders},
 {k:'desc',label:'The issue',t:'area',q:'What is the issue about?',why:'Explain the problem or need in your own words, so someone outside your team can follow it.',ph:'Describe the issue…',ex:'Expedite requests are approved by email, so nobody can see where a request stands.'},
 {k:'asis',label:'Current practice',t:'area',q:'What is the current practice?',why:'Walk us through how it is handled today in the system, including manual steps, spreadsheets and emails.',ph:'Today we…',ex:'1. Sales submits a form. 2. Ops approves by email. 3. Fulfillment updates a tracker.'},
 {k:'future',label:'Change request',t:'area',q:'What should the system do?',why:'Tell us what you want the system to do. The implementation team will propose how to set it up in SAP S/4HANA.',ph:'The system must…',ex:'The system must route the request to approvers and notify the requester.',opt:true},
 {k:'priority',label:'Priority',t:'big',q:'How urgent is this requirement?',why:'Pick the level that best matches how much it affects your work today. The project team uses this to decide what to look at first.',opts:(L().priority&&L().priority.length?L().priority:['High','Medium','Low']).map(v=>[v,PRI_DESC[String(v).toLowerCase()]||''])},
 {k:'usecase',label:'Supporting documents',t:'area',url:true,opt:true,q:'Do you have documentation or a written process flow for this?',why:'Paste the link(s) to the document, wiki page or process flow. It helps the implementation team understand the requirement.',ph:'Paste the link here…',ex:'Link to a Google Doc, slide deck or wiki page'},
 {k:'lucid',label:'Lucid chart',t:'area',url:true,opt:true,q:'Is there a Lucid chart of the process?',why:'Paste the link to your Lucid chart so the implementation team can follow the flow.',ph:'Paste the Lucid chart link here…',ex:'Link to your Lucid chart document'},
 {k:'demo',label:'Demo ready',t:'big',q:'Are you willing to demonstrate this to the implementation team?',why:'A short walk-through helps the implementation team understand how the process works today.',opts:[['Yes','I can walk the team through it'],['No','I am not able to demo it'],['Maybe','Possibly, depending on timing']]},
 {k:'notes',label:'Personal note',t:'area',opt:true,q:'Would you like to add a personal note?',why:'Add anything you want to remember about this requirement. You can find it again in the Register whenever you need it. Everyone who can open this requirement will see it.',ph:'Type your note here…',ex:'Check with Finance before the the implementation team workshop'},
 {k:'rev',label:'Review',t:'review',q:'Ready to save?',why:'Check each answer. You can change any of them. Your REQ number is assigned when you save.'}];
let GUIDE=null,GQ='',GFOC='';
function setGuide(g){GUIDE=(g&&g.areas)?g:null;if(GUIDE)Object.keys(GUIDE.areas).forEach(k=>{const a=GUIDE.areas[k];a.txt=(k+' '+a.items.map(i=>i.p+' '+i.a).join(' ')).toLowerCase()})}
const hasGuide=()=>!!(GUIDE&&Object.keys(GUIDE.areas).length);
const gInfo=a=>{if(!hasGuide())return null;const key=Object.keys(GUIDE.areas).find(k=>k.toLowerCase()===String(a).toLowerCase());return key?GUIDE.areas[key]:null};
const gtok=()=>GQ.toLowerCase().split(' ').map(x=>x.trim()).filter(x=>x.length>1);
function gScore(a){const g=gInfo(a),tok=gtok();if(!g||!tok.length)return 0;return tok.filter(k=>g.txt.indexOf(k)>-1).length}
function hl(t,tok){const s=String(t||''),low=s.toLowerCase();if(!tok.length)return esc(s);let out='',i=0;
 while(i<s.length){let best=-1,len=0;tok.forEach(k=>{const p=low.indexOf(k,i);if(p>-1&&(best<0||p<best||(p===best&&k.length>len))){best=p;len=k.length}});
  if(best<0){out+=esc(s.slice(i));break}
  out+=esc(s.slice(i,best))+'<mark>'+esc(s.slice(best,best+len))+'</mark>';i=best+len}
 return out}
function gHits(){if(!gtok().length||!hasGuide())return [];return Object.keys(GUIDE.areas).map(k=>[k,gScore(k)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
function gMatchHTML(){if(!gtok().length)return '';const h=gHits();return h.length?h.length+(h.length===1?' area matches: ':' areas match: ')+esc(h.join(', ')):'No area matches that keyword. Try another word, or browse the list below.'}
function gCardHTML(){
 if(!GFOC)return '<p class="gs" style="margin:0">Not sure which one to pick? Point at or tap the <b>i</b> next to an area to see what it covers, or type a keyword in the search box.</p>';
 const g=gInfo(GFOC);if(!g)return '';const tok=gtok(),sel=(ans.area||[]).includes(GFOC);
 return `<div class="gc"><div class="gt"><b>${esc(GFOC)}</b>${g.l1.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><p class="gs">What this area covers</p><ul>${g.items.map(i=>`<li><b>${hl(i.p,tok)}</b><span>${hl(i.a,tok)}</span></li>`).join('')}</ul><button class="btn ${sel?'g':'p'} sm" data-pick="${esc(GFOC)}">${sel?'Remove this area':'Select this area'}</button></div>`}
function areaPickerHTML(s){const tok=gtok(),groups={},order=[];
 s.opts.forEach(a=>{const g=gInfo(a),l1=g?g.l1[0]:'Other areas';if(!groups[l1]){groups[l1]=[];order.push(l1)}groups[l1].push(a)});
 order.sort((x,y)=>{const i=GUIDE.order.indexOf(x),j=GUIDE.order.indexOf(y);return (i<0?99:i)-(j<0?99:j)});
 return `<div class="gsearch"><input class="t" id="gq" type="search" autocomplete="off" value="${esc(GQ)}" placeholder="Not sure? Type a keyword, for example discount, invoice, return or delivery" aria-label="Search process areas"></div><div class="hint" id="gmatch" style="min-height:20px">${gMatchHTML()}</div><div class="gwrap">`+order.map(l1=>`<div class="gh">${esc(l1)}</div><div class="chips" style="margin:6px 0 12px">${groups[l1].map(a=>{const on=(ans.area||[]).includes(a),sc=gScore(a);return `<span class="chipw ${sc?'hit':''} ${tok.length&&!sc&&!on?'dim':''}"><button class="chip ${on?'sel':''}" data-c="${esc(a)}">${esc(a)}</button>${gInfo(a)?`<button class="info" data-i="${esc(a)}" aria-label="What is in ${esc(a)}?" title="What is in this area?">i</button>`:''}</span>`}).join('')}</div>`).join('')+'</div>'}
function gRoot(){return capMode==='split'?$('#cv-split'):$('#cv-conv')}
function setFoc(a){GFOC=a;const c=gRoot().querySelector('#gcard');if(c){c.innerHTML=gCardHTML();bindPick();const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}}
function bindPick(){const b=gRoot().querySelector('#gcard [data-pick]');if(b)b.onclick=()=>{pick(STEPS()[ci],b.dataset.pick);drawChat()}}
function applyGuideSearch(){const tok=gtok();gRoot().querySelectorAll('.chipw').forEach(w=>{const a=w.querySelector('.chip').dataset.c,sc=gScore(a);w.classList.toggle('hit',sc>0);w.classList.toggle('dim',tok.length>0&&sc===0&&!w.querySelector('.chip.sel'))});
 const m=gRoot().querySelector('#gmatch');if(m)m.innerHTML=gMatchHTML();const h=gHits();if(h.length)setFoc(h[0]);else setFoc(GFOC)}
function bindGuide(){if(!hasGuide())return;const s=STEPS()[ci];if(!s||s.k!=='area')return;
 gRoot().querySelectorAll('.chipw .chip').forEach(c=>{c.onmouseenter=()=>setFoc(c.dataset.c);c.onfocus=()=>setFoc(c.dataset.c)});
 gRoot().querySelectorAll('.chipw .info').forEach(b=>{b.onclick=()=>setFoc(b.dataset.i)});
 const q=gRoot().querySelector('#gq');if(q)q.oninput=()=>{GQ=q.value;applyGuideSearch()};

let ans={},ci=0,cdone=null,saving=false;

  const pend=rows.filter(r=>r.status==='Pending'),act=rows.filter(r=>r.status==='Active');
  p.innerHTML=cards+addBoxHTML()+`<div class="box" style="margin-bottom:16px"><h3>Waiting for your approval (${pend.length})</h3>${pend.length?`<div class="tw"><table style="min-width:640px"><tbody>${pend.map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="hint">${esc(r.email)}</span></td><td>Asked for <b>${esc(r.reqRole)}</b><br><span class="hint">${esc(r.reason)}</span></td><td><div class="ra"><select class="t" data-ar="${esc(r.email)}" style="padding:4px 8px">${['viewer','editor','owner'].map(x=>`<option ${x===r.reqRole?'selected':''}>${x}</option>`).join('')}</select><button data-ap="${esc(r.email)}" style="background:var(--mint);color:#2D2A27">Approve</button><button data-dc="${esc(r.email)}">Decline</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No requests waiting.</div>'}</div>
  <div class="box"><h3>Everyone with access (${act.length})</h3><div class="tw"><table style="min-width:640px"><thead><tr><th>Person</th><th>Role</th><th>Since</th><th></th></tr></thead><tbody>${act.map(r=>`<tr><td><span><b>${esc(r.name||r.email)}</b> <button class="btn g sm" data-en="${esc(r.email)}">Edit name</button></span><br><span class="hint">${esc(r.email)}</span></td><td><select class="t" data-sr="${esc(r.email)}" style="padding:4px 8px">${['viewer','editor','owner'].map(x=>`<option ${x===r.role?'selected':''}>${x}</option>`).join('')}</select></td><td>${esc(fmt(r.at))}</td><td><button class="btn g sm" data-rv="${esc(r.email)}">Revoke</button></td></tr>`).join('')}</tbody></table></div></div>`;
  bindAdd();
  const run=async(msg,fn,...a)=>{try{await api(fn,...a);toast(msg);renderAccess()}catch(e){toast(e.message,true);renderAccess()}};
  $$('[data-ap]').forEach(b=>b.onclick=()=>run('Access approved','decideAccess',b.dataset.ap,'approve',$(`[data-ar="${b.dataset.ap}"]`).value));
  $$('[data-dc]').forEach(b=>b.onclick=()=>run('Request declined','decideAccess',b.dataset.dc,'decline',''));
  $$('[data-sr]').forEach(s=>s.onchange=()=>run('Role updated','setRole',s.dataset.sr,s.value));
  $$('[data-rv]').forEach(b=>b.onclick=async()=>{const p=act.find(x=>x.email===b.dataset.rv);const go=await askConfirm({title:'Remove access for '+((p&&p.name)||b.dataset.rv)+'?',message:'They will no longer be able to open the app. You can approve them again later.',ok:'Remove access',cancel:'Cancel',danger:true});if(go)run('Access removed','revokeAccess',b.dataset.rv)});
  $$('[data-en]').forEach(b=>b.onclick=()=>{const em=b.dataset.en,row=act.find(x=>x.email===em),host=b.parentElement;
   host.innerHTML=`<input class="t" id="nm-in" style="padding:6px 10px;width:230px" value="${esc(row.name||'')}" aria-label="Name"> <button class="btn p sm" id="nm-save">Save</button> <button class="btn g sm" id="nm-x">Cancel</button>`;
   $('#nm-in').focus();$('#nm-x').onclick=renderAccess;
   $('#nm-save').onclick=async()=>{try{const v=$('#nm-in').value.trim();await api('updateName',em,v);if(em===ME.email)setMyName(v);toast('Name updated');renderAccess()}catch(e){toast(e.message,true)}}});
 }catch(e){p.innerHTML=cards+`<div class="box"><div class="empty">${esc(e.message)}</div></div>`}}

let LOG=[],LF={q:'',a:'',s:''};
async function renderLog(){
 const p=$('#p-log');if(!can('owner'))return;
 if(!p.dataset.built){p.dataset.built=1;p.innerHTML=`<div class="bar2"><input class="t grow" id="l-q" type="search" placeholder="Search person, REQ # or field" aria-label="Search log"><select class="t" id="l-a"><option value="">All actions</option><option>Created</option><option>Edited</option><option>Deleted</option><option>Restored</option><option>Access</option></select><select class="t" id="l-s"><option value="">All sources</option><option>Web app</option><option>Google Sheet</option></select><button class="btn g" id="l-c">Clear filters</button><button class="btn g" id="l-x">Export CSV</button></div><div class="box"><ul class="tl" id="l-list"></ul></div>`;
  $('#l-q').oninput=e=>{LF.q=e.target.value;drawLog()};$('#l-a').onchange=e=>{LF.a=e.target.value;drawLog()};$('#l-s').onchange=e=>{LF.s=e.target.value;drawLog()};
  $('#l-c').onclick=()=>{LF={q:'',a:'',s:''};$('#l-q').value='';$('#l-a').value='';$('#l-s').value='';drawLog()};
  $('#l-x').onclick=()=>csv('audit-log',['When','User','Action','REQ #','Field','Old','New','Source'],LOG.map(l=>[l.at,l.user,l.action,l.req,l.field,l.oldV,l.newV,l.source]))}
 try{LOG=await api('getLog');drawLog()}catch(e){$('#l-list').innerHTML=`<li><div class="empty">${esc(e.message)}</div></li>`}}
function drawLog(){const q=LF.q.toLowerCase(),rows=LOG.filter(l=>(!q||(l.user+' '+l.req+' '+l.field+' '+l.newV+' '+l.oldV).toLowerCase().includes(q))&&(!LF.a||(LF.a==='Access'?/^(Access|User added|Role changed|Name changed)/.test(l.action):l.action.startsWith(LF.a)))&&(!LF.s||l.source===LF.s));
 const ic=a=>a.startsWith('Created')?['+','var(--orange)']:a.startsWith('Edited')||a==='Bulk edit'?['E','var(--mint)']:a.startsWith('Deleted')?['×','var(--quartz)']:a.startsWith('Restored')?['↺','var(--mint)']:['A','var(--rose)'];
 $('#l-list').innerHTML=rows.map(l=>{const [c,bg]=ic(l.action);return `<li><span>${esc(fmt(l.at))}<br>${esc(l.user)}</span><span class="ic" style="background:${bg}">${c}</span><div>${esc(l.action)} ${l.req?'<b>'+esc(l.req)+'</b>':''} ${l.field?'· '+esc(l.field):''} <span class="hint">· ${esc(l.source)}</span>${(l.oldV||l.newV)?`<div class="diff">${l.oldV?'<s>'+esc(l.oldV.slice(0,160))+'</s> → ':''}<u>${esc(l.newV.slice(0,160))}</u></div>`:''}</div></li>`}).join('')||'<li><div class="empty">No log entries match.</div></li>'}

window.addEventListener('load',()=>{if(!window.__DEMO)init()});
</script></body></html>
