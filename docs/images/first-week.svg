<circle cx="1047" cy="150" r="22" fill="#FF7023" stroke="#FFF5E3" stroke-width="5"/>
<text x="1047" y="156" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="middle">5</text>
<rect x="944" y="200" width="206" height="250" rx="16" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<text x="964" y="236" font-size="13" font-weight="600" fill="#6F675E" text-anchor="start">Day 5</text>
<text x="964" y="264" font-size="19" font-weight="700" fill="#2D2A27" text-anchor="start">Tidy and report</text>
