<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d" font-family="Instrument Sans, Arial, Helvetica, sans-serif">
<title id="t">A new business analyst&#x27;s first week</title><desc id="d">Five days: get access, capture a requirement, review the register, triage, then tidy and report.</desc>
<rect width="1200" height="560" fill="#FFF5E3"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2D2A27"/></marker></defs>
<text x="40" y="48" font-size="26" font-weight="700" fill="#2D2A27" text-anchor="start">Your first week as a business analyst</text>
<text x="40" y="76" font-size="15" font-weight="400" fill="#6F675E" text-anchor="start">One short goal a day. Each day has a check at the end of the guide.</text>
<line x1="100" y1="150" x2="1100" y2="150" stroke="#D0C8BA" stroke-width="4" stroke-linecap="round"/>
<circle cx="143" cy="150" r="22" fill="#C5E4CC" stroke="#FFF5E3" stroke-width="5"/>
<text x="143" y="156" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="middle">1</text>
<rect x="40" y="200" width="206" height="250" rx="16" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<text x="60" y="236" font-size="13" font-weight="600" fill="#6F675E" text-anchor="start">Day 1</text>
<text x="60" y="264" font-size="19" font-weight="700" fill="#2D2A27" text-anchor="start">Get in</text>
<circle cx="66" cy="301" r="4" fill="#C5E4CC"/>
<text x="80" y="306" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Request access</text>
