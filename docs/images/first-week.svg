<circle cx="595" cy="150" r="22" fill="#DEA193" stroke="#FFF5E3" stroke-width="5"/>
<text x="595" y="156" font-size="16" font-weight="700" fill="#2D2A27" text-anchor="middle">3</text>
<rect x="492" y="200" width="206" height="250" rx="16" fill="#FFFDF8" stroke="#D0C8BA" stroke-width="1.5"/>
<text x="512" y="236" font-size="13" font-weight="600" fill="#6F675E" text-anchor="start">Day 3</text>
<text x="512" y="264" font-size="19" font-weight="700" fill="#2D2A27" text-anchor="start">Review</text>
<circle cx="518" cy="301" r="4" fill="#DEA193"/>
<text x="532" y="306" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Filter the register</text>
<circle cx="518" cy="335" r="4" fill="#DEA193"/>
<text x="532" y="340" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Read the details</text>
