<text x="306" y="340" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Try both layouts</text>
<circle cx="292" cy="369" r="4" fill="#F2CDC4"/>
<text x="306" y="374" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Edit it once</text>
