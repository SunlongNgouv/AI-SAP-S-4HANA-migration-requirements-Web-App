<text x="80" y="340" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Take the tour</text>
<circle cx="66" cy="369" r="4" fill="#C5E4CC"/>
<text x="80" y="374" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Open the sheet</text>
<rect x="60" y="396" width="166" height="34" rx="8" fill="#EFEDE8"/>
<circle cx="369" cy="150" r="22" fill="#F2CDC4" stroke="#FFF5E3" stroke-width="5"/>
