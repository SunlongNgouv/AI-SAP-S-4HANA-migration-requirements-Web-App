<text x="984" y="306" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Find duplicates</text>
<circle cx="970" cy="335" r="4" fill="#FF7023"/>
<text x="984" y="340" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Ask follow-ups</text>
<circle cx="970" cy="369" r="4" fill="#FF7023"/>
<text x="984" y="374" font-size="15" font-weight="400" fill="#2D2A27" text-anchor="start">Export a summary</text>
<rect x="60" y="396" width="166" height="34" rx="8" fill="#EFEDE8"/>
<rect x="286" y="396" width="166" height="34" rx="8" fill="#EFEDE8"/>
<rect x="512" y="396" width="166" height="34" rx="8" fill="#EFEDE8"/>
<rect x="738" y="396" width="166" height="34" rx="8" fill="#EFEDE8"/>
<rect x="964" y="396" width="166" height="34" rx="8" fill="#EFEDE8"/>
<text x="143" y="418" font-size="12.5" font-weight="600" fill="#2D2A27" text-anchor="middle">I can sign in</text>
<text x="369" y="418" font-size="12.5" font-weight="600" fill="#2D2A27" text-anchor="middle">One saved requirement</text>
<text x="595" y="418" font-size="12.5" font-weight="600" fill="#2D2A27" text-anchor="middle">I can find anything</text>
<text x="821" y="418" font-size="12.5" font-weight="600" fill="#2D2A27" text-anchor="middle">Every row triaged</text>
<text x="1047" y="418" font-size="12.5" font-weight="600" fill="#2D2A27" text-anchor="middle">A clean weekly list</text>
<text x="40" y="500" font-size="16" font-weight="600" fill="#2D2A27" text-anchor="start">Goal for the week: you can capture, review and triage requirements without help, and the register stays tidy.</text>
</svg>